# Static site. Copy only the runtime files so docs/tests stay off the CDN.
[build]
  command = "mkdir -p dist && cp index.html styles.css app.js engine.js compound.js motion.js icons.js favicon.svg dist/"
  publish = "dist"

# Hash views (#positions / #journal / #compound). No SPA rewrite needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
