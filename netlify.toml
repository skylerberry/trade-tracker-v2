# Static site. The file list lives ONCE, in package.json's build script —
# the GitHub Actions deploy runs the same command (a divergent copy list
# here once shipped an index.html referencing a qr.js that never deployed).
[build]
  command = "npm run build"
  publish = "dist"

# Event functions live beside the static publish dir, not inside dist/.
# `netlify deploy --dir=dist --no-build` still reads this from repo-root
# netlify.toml and uploads the folder.
[functions]
  directory = "netlify/functions"

# Hash views (#positions / #journal / #compound / #themes). No SPA rewrite needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
